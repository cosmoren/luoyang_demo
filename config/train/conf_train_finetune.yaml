training:
  epochs: 10
  lr: 2e-4
  batch_size: 64
  save_every: 5
  # dataset holds large in-memory caches; each worker forks a full copy,
  # so num_workers > 0 can easily OOM the node. Keep 0 unless memory allows.
  num_workers: 0
  # LR warmup epochs. 0 = no warmup (recommended for finetune);
  # use a few epochs (e.g. 3-5) when training from scratch.
  # CLI --warmup-epochs overrides this value.
  warmup_epochs: 0
  # Huber loss delta; larger values behave closer to MSE, smaller to MAE.
  # CLI --huber-delta overrides this value.
  huber_delta: 2000
  # null = run every batch in an epoch
  train_max_batches_per_epoch: null
  # freeze TabM head during training/finetune.
  # true  = lock pv_tabm_head (typical finetune with --init-checkpoint)
  # false = train everything (typical training from scratch)
  # CLI --freeze-tabm / --no-freeze-tabm overrides this value.
  freeze_tabm: false
