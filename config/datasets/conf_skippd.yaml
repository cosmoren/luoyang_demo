# SKIPP'd-specific overrides on top of the shared `config/train/conf_train.yaml`.
# Only keys explicitly set here override the shared defaults; missing keys inherit.
# Trainer flow: load conf_train.yaml -> apply this `training:` block -> CLI flags win.
training:
  epochs: 40

# Stanford SKIPP'd (Huang Engineering rooftop) — PV CSV + sky Zarr (no NWP, no satellite).
# -----------------------------------------------------------------------------
# This file mirrors ``config/datasets/conf_folsom.yaml`` field-by-field so the
# SKIPP'd dataloader/trainer can reuse Folsom's _dataset_kwargs builder verbatim.
# The only SKIPP'd-specific substitutions are:
#   * paths.data_dir / pv_path / sky_image_path point at the SKIPP'd dataset.
#   * site.{latitude, longitude} are inlined here because SKIPP'd has no
#     <data_dir>/info.yaml (Folsom reads coords from info.yaml; SKIPP'd reads
#     them from this YAML's ``site:`` block, with a hardcoded fallback in
#     dataloader/skippd_pv.py).
#   * No ``folsom_nwp_merged_csv`` (SKIPP'd has no merged NWP CSV); the dataloader
#     emits a zero ``nwp_tensor`` of Folsom's shape.
#
# Run SKIPP'd PV training:
#   python training/train_vit_test_skippd.py --dataset-config conf_skippd.yaml
# -----------------------------------------------------------------------------

site:
  name: "Stanford SKIPP'd (Huang Engineering rooftop)"
  # Folsom reads lat/lon from <data_dir>/info.yaml; SKIPP'd has no info.yaml so
  # the dataloader reads them from this block instead (with a hardcoded fallback).
  latitude: 37.4275
  longitude: -122.1697
  # Informational only — the dataloader uses ``_SKIPPD_PV_SCALE = 30.0`` (module
  # constant in dataloader/skippd_pv.py) as the actual PV normalization scale.
  rated_capacity_kw: 30.0

paths:
  data_dir: "/work/skippd_dataset"
  # Folder containing the single PV CSV (Date, Huang_E4102_kW).
  pv_path: pv
  sky_format: zarr
  # Sky Zarr store (``images`` data variable on a ``time_utc`` timeline).
  sky_image_path: sky_utc.zarr
  # No satellite for SKIPP'd; placeholder for API parity with Folsom/PVDataset.
  sat_path: sat
  # No NWP for SKIPP'd. ``nwp_path`` kept empty for parity with Folsom's schema
  # key; the SKIPP'd dataloader does not read this field.
  nwp_path: ""

# Sampling / window keys for ``dataloader.skippd_pv`` and
# ``training/train_vit_test_skippd.py``. Same schema as conf_folsom.yaml.
sampling:
  # CSV row spacing — SKIPP'd PV CSV is 1-minute UTC.
  csv_interval_min: 1
  # Input window (X) and forecast window (Y) — identical to Folsom defaults.
  pv_input_interval_min: 5      # multiple of csv_interval_min
  pv_input_len: 576             # 576 * 5min = 48 h history
  pv_output_interval_min: 15    # multiple of csv_interval_min
  pv_output_len: 192            # 192 * 15min = 48 h forecast
  # Required by the dataset constructor signature; the dataset uses a fixed
  # 60/10/30 row split (SkipPP'd; Folsom uses 66/18/18) and ignores this value at runtime.
  pv_train_time_fraction: 0.7
  test_anchor_stride_min: 1500
  val_anchor_stride_min: 7000
  test_collect_time_match_tolerance_min: 0
  # Sky stack (last N frames ending at the anchor; zarr time series).
  skyimg_window_size: 30
  skyimg_time_resolution_min: 1
  skyimg_spatial_size: 224
  # Sat keys are required by the dataset constructor for API parity. SKIPP'd has
  # no satellite imagery; ``sat_tensor`` / ``sat_timefeats`` returned as None.
  satimg_window_size: 24
  satimg_time_resolution_min: 10
  satimg_npy_shape_hwc: [100, 100, 3]
