# Folsom-specific overrides on top of the shared `config/train/conf_train.yaml`.
# Only keys explicitly set here override the shared defaults; missing keys inherit.
# Trainer flow: load conf_train.yaml -> apply this `training:` block -> CLI flags win.
training:
  epochs: 40

# Folsom, CA — irradiance CSV + sky Zarr + (optional) merged NWP CSV.
# -----------------------------------------------------------------------------
# Same schema as Luoyang `pv_*` keys (no `irr_*`, no `dataset_profile: folsom`).
# Used by ``dataloader.folsom`` and ``training/train_vit_test_folsom.py``.
#
# Run Folsom training:
#   python training/train_vit_test_folsom.py --dataset-config conf_folsom.yaml
# -----------------------------------------------------------------------------

site:
  name: "Folsom, CA"

paths:
  data_dir: "/work/folsom_dataset"
  # PVDataset reads this Excel via train_vit_test.py main() to build dev_dn_list.
  # FolsomIrradianceDataset itself never reads it (returns dev_idx=0 for the single GHI sensor),
  # so we keep the Luoyang Excel as a placeholder; trainer's nn.Embedding lookup still works.
  # FolsomIrradianceDataset globs `pv_path` for exactly one CSV (the Folsom irradiance file).
  pv_path: irradiance
  sky_format: zarr
  sky_image_path: sky_zarr
  # Folsom GOES-15 GridSat-CONUS per-frame shards live under
  # ``<data_dir>/sat_goes_gridsat/YYYY/MM/goes15_YYYYMMDD_HHMM.npy`` (3 x 100 x 100 float16,
  # values in [0, 1]; ~94k files covering 2014-01-01 -> 2016-12-31 UTC). Used when
  # ``sampling.use_satellite: true``; otherwise FolsomIrradianceDataset never reads from
  # this directory.
  sat_path: sat_goes_gridsat
  # PVDataset uses `paths.nwp_path` (folder with solar.csv / wind.csv); placeholder for Folsom.
  nwp_path: NWP
  # Folsom-specific: single merged NWP CSV (reftime, valtime, ssrd/cloud_cover/.../temperature/.../wind).
  # If missing or unreadable, FolsomIrradianceDataset falls back to zero NWP + per-step invalid mask.
  folsom_nwp_merged_csv: NWP/nwp_merged_averaged.csv

# Sampling / window keys for ``dataloader.folsom`` and ``training/train_vit_test_folsom.py``
sampling:
  # Random anchor draws per training epoch from the valid-train pool.
  # Folsom has ~925k valid train anchors; 100k/epoch over 40 epochs is 4M total
  # draws -> ~99% unique-anchor coverage, ~4.3x average per-anchor revisits.
  # Going past 4M total draws is mostly diminishing returns. CLI flag
  # --train_epoch_len overrides this; fallback if absent is the dataloader
  # constant _DEFAULT_FOLSOM_TRAIN_EPOCH_LEN.
  train_epoch_len: 100000
  # CSV row spacing (Folsom is 1-min; Luoyang was 5-min).
  csv_interval_min: 1
  # PVDataset / FolsomIrradianceDataset input window (X) and forecast window (Y).
  pv_input_interval_min: 5      # multiple of csv_interval_min
  pv_input_len: 576             # 576 * 5min = 48 h history
  pv_output_interval_min: 15    # multiple of csv_interval_min
  pv_output_len: 16             # 16 * 15min = 4 h forecast
  # Time-based split: 60% train / 10% val / 30% test (fixed in the dataset class; this fraction
  # is required by the schema but only `pv_train_time_fraction` is read for legacy parity).
  pv_train_time_fraction: 0.7
  test_anchor_stride_min: 1500
  val_anchor_stride_min: 7000
  test_collect_time_match_tolerance_min: 0
  # Sky stack (last N frames ending at the anchor; zarr time series).
  skyimg_window_size: 30
  skyimg_time_resolution_min: 1
  skyimg_spatial_size: 224
  # Sky-branch input channels (concatenated along C in list order). Valid names:
  #   - "rgb"       (3 channels) — historical default, RGB frame from JPEG/Zarr.
  #   - "ray_map"   (3 channels) — fixed fisheye unit-vector field from
  #                                ``utils/fisheye_raymap.py``; same across T.
  #   - "sun_mask"  (1 channel)  — per-frame binary disc around the sun direction,
  #                                computed via an angular threshold against the
  #                                cached ray map (see ``sun_mask_radius_deg``
  #                                below). Below-horizon frames are all-zero.
  # Omitting this key (or leaving it as ["rgb"]) is byte-identical to legacy
  # 3-channel behavior, including for existing checkpoints. The model's
  # sky-branch first conv is sized from ``train_dataset.sky_in_channels``.
  sky_channels: ["rgb"]
  # Angular radius (degrees) of the ``sun_mask`` disc. Only consulted when
  # ``sky_channels`` includes ``"sun_mask"``. Default (key absent) is 10.0°,
  # which comfortably covers the visible sun disc (~0.27° radius) plus its
  # bright glare halo on the Folsom fisheye. At 224x224 / 180° equidistant
  # FOV, 10° corresponds to ~12.4 pixels of linear radius (so the disc is
  # roughly 25 pixels across). Earlier defaults of 1°-3° produced sub-pixel
  # to a-few-pixel discs that missed the halo.
  # sun_mask_radius_deg: 10.0
  # Enable Folsom GOES-15 satellite branch. When true, the loader resolves per-frame
  # NPY shards from <data_dir>/<paths.sat_path>/YYYY/MM/goes15_YYYYMMDD_HHMM.npy and
  # emits sat_tensor [T_sat, 3, 100, 100] + sat_timefeats [T_sat, 9]. When false,
  # sat_tensor / sat_timefeats are None; the model (see models/models.py:727) treats
  # None / all-zero as "no sat" and uses a learned zero embedding instead. The CLI
  # flag --use-satellite / --no-use-satellite on the trainer overrides this value.
  use_satellite: true
  # Satellite stack: 24 frames at 15-min cadence ending floor_15(time0 - 30 min) (oldest -> newest).
  # NPY shards on disk are CHW (3, 100, 100) float16 already in [0, 1]; the loader returns float32.
  # ``satimg_npy_shape_hwc`` is kept in [H, W, C] order to match the PVDataset constructor signature;
  # ``dataloader.folsom._load_satimg_tensor`` accepts both CHW and HWC layouts. With
  # ``use_satellite: false`` only ``satimg_npy_shape_hwc`` is consulted (for the zero-tensor
  # fallback in the model) and the shards are never opened.
  satimg_window_size: 24
  satimg_time_resolution_min: 15
  satimg_npy_shape_hwc: [100, 100, 3]

